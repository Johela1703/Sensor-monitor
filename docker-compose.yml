services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sensordb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://app:app@db:3306/sensordb
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: 1883
      MQTT_TOPICS: sensor/temperature,sensor/humidity,sensor/voltage,sensor/current,sensor/pressure
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mqtt
volumes:
  db_data:
